[package]
name = "xylem-macros"
version = "0.1.1"
edition = "2021"
description = "Proc-macro attributes for writing libxylem modules and hooks in Rust"
license = "BSD-2-Clause"
readme = "../README.md"
repository = "https://github.com/tty-pt/libxylem"
keywords = ["plugin", "hooks", "modules", "proc-macro", "extensibility"]
categories = ["development-tools", "rust-patterns"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
