[package]
name = "xylem"
version = "0.1.1"
edition = "2021"
description = "Ergonomic Rust bindings for libxylem — hook-based extensibility and dynamic module loading"
license = "BSD-2-Clause"
readme = "../README.md"
repository = "https://github.com/tty-pt/libxylem"
keywords = ["plugin", "hooks", "modules", "extensibility", "ffi"]
categories = ["api-bindings", "development-tools"]

[lib]
crate-type = ["rlib"]

[dependencies]
xylem-macros = { path = "../xylem-macros", version = "0.1.1" }
