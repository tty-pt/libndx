[package]
name = "ndx"
version = "0.1.1"
edition = "2021"
description = "Ergonomic Rust bindings for libndx — hook-based extensibility and dynamic module loading"
license = "BSD-2-Clause"
readme = "../README.md"
repository = "https://github.com/tty-pt/libndx"
keywords = ["plugin", "hooks", "modules", "extensibility", "ffi"]
categories = ["api-bindings", "development-tools"]

[lib]
crate-type = ["rlib"]

[dependencies]
ndx-macros = { path = "../ndx-macros", version = "0.1.1" }
